<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
      body {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 1.5fr 3fr 1fr;
        gap: 15px;
      }

      header {
        grid-column: 1 / 2;
      }

      nav {
        grid-column: 2 / -1;
        display: flex;
        gap: 30px;
        align-items: center;
        justify-content: center;
      }

      nav a {
        background-color: white;
        padding: 15px;
        border-radius: 5px;
        font-size: 30px;
        text-decoration: none;
      }

      main {
        grid-column: 1 / -1;
        grid-row: 2 / 3;
      }

      footer {
        grid-column: 1 / -1;
      }


    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Over ons</a>
      <a href="#">Contact</a>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
